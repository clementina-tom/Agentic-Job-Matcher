<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentic Job Matcher Dashboard</title>
    <style>
      :root { font-family: Inter, system-ui, sans-serif; color-scheme: light dark; }
      body { margin: 0; padding: 20px; background: #0f172a; color: #e2e8f0; }
      h1 { margin-top: 0; }
      .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
      .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; }
      .muted { color: #94a3b8; font-size: 0.9rem; }
      table { width: 100%; border-collapse: collapse; margin-top: 16px; background: #0b1220; }
      th, td { text-align: left; border-bottom: 1px solid #334155; padding: 8px; font-size: 0.9rem; }
      code { background: #111827; padding: 2px 6px; border-radius: 6px; }
      .pill { border-radius: 999px; padding: 2px 10px; font-size: 0.75rem; border: 1px solid #334155; }
    </style>
  </head>
  <body>
    <h1>Agentic Job Matcher</h1>
    <p class="muted">Lightweight local dashboard. Serve this folder and keep JSON artifacts under <code>data/</code>.</p>

    <section class="grid" id="metrics"></section>

    <h2>Recent Matches</h2>
    <table>
      <thead>
        <tr>
          <th>Role</th>
          <th>Company</th>
          <th>Fit</th>
          <th>Decision</th>
          <th>Source</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <script>
      const loadJson = async (path) => {
        try {
          const res = await fetch(path);
          if (!res.ok) return [];
          return await res.json();
        } catch {
          return [];
        }
      };

      const metricCard = (title, value) => `
        <article class="card">
          <div class="muted">${title}</div>
          <div style="font-size:1.5rem;font-weight:700">${value}</div>
        </article>`;

      const run = async () => {
        const [jobsResp, matchesResp, appsResp] = await Promise.all([
          loadJson('/api/discovered_jobs'),
          loadJson('/api/match_results'),
          loadJson('/api/application_results')
        ]);
        const jobs = jobsResp.items || [];
        const matches = matchesResp.items || [];
        const apps = appsResp.items || [];

        document.getElementById('metrics').innerHTML = [
          metricCard('Discovered Jobs', jobs.length),
          metricCard('Matched Jobs', matches.length),
          metricCard('Applications', apps.length),
          metricCard('Apply Decisions', matches.filter(m => m.decision === 'apply').length)
        ].join('');

        const rows = matches.slice(0, 20).map((m) => {
          const j = m.job || {};
          const fit = typeof m.fit_score === 'number' ? m.fit_score.toFixed(2) : '-';
          return `
            <tr>
              <td>${j.job_title || '-'}</td>
              <td>${j.company || '-'}</td>
              <td>${fit}</td>
              <td><span class="pill">${m.decision || '-'}</span></td>
              <td>${j.source_type || '-'}</td>
            </tr>`;
        });

        document.getElementById('rows').innerHTML = rows.join('') || '<tr><td colspan="5" class="muted">No match data found yet.</td></tr>';
      };

      run();
    </script>
  </body>
</html>
